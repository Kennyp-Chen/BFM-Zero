# @package _global_

defaults:
  - /env: legged_motions
  - /simulator: isaacsim
  - /domain_rand: domain_rand
  - /rewards: reward_bfm_zero
  - /robot: h1/H1_P_12L10A0G2H1W_260402
  - /terrain: terrain_locomotion_plane
  - /obs: bfm_zero_obs
  - /callbacks: im_eval
  - _self_

exp_base: ${hydra:runtime.choices.exp}
exp_var: h1_p12l10
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 50
project_name: BFMZeroH1

terrain:
  ground_plane_usd: humanoidverse/data/isaac/default_environment.usd

robot:
  motion:
    motion_file: data/h1_lafan_10s-clipped.pkl
    max_len: 450
  asset:
    self_collisions: 0

rewards:
  reward_penalty_curriculum: True
  reward_penalty_degree: 0.000006

env:
  config:
    resample_motion_when_training: False
    termination:
      terminate_when_motion_far: False
    termination_curriculum:
      terminate_when_motion_far_curriculum: False
      terminate_when_motion_far_threshold_min: 0.25
      terminate_when_motion_far_threshold_max: 0.5
      terminate_when_motion_far_curriculum_degree: 0.000025
